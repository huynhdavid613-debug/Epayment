<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - VÉNUS Cửa Hàng Trực Tuyến</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #f5e6e6 0%, #fdf0f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(217, 126, 126, 0.2);
            width: 100%;
            max-width: 450px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            color: #d97e7e;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 10px;
        }

        h1 {
            color: #c95252;
            font-size: 28px;
            margin: 15px 0;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #f0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.3s;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="tel"]:focus {
            outline: none;
            border-color: #d97e7e;
            box-shadow: 0 0 0 3px rgba(217, 126, 126, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 40px;
            background: none;
            border: none;
            color: #d97e7e;
            cursor: pointer;
            font-size: 18px;
        }

        .toggle-password:hover {
            color: #c95252;
        }

        .error-message {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .terms {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .terms input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
        }

        .terms-error {
            color: #d32f2f;
            font-size: 12px;
            display: none;
            margin-top: 5px;
        }

        .btn-register {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #d97e7e 0%, #c95252 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(217, 126, 126, 0.3);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #d97e7e;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* THÔNG BÁO */
        .toast {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 3000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .toast.error {
            background: #d32f2f;
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">VÉNUS</div>
            <h1>Đăng Ký Tài Khoản</h1>
            <p class="subtitle">Tạo tài khoản mới để bắt đầu mua sắm</p>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <!-- Họ và Tên -->
            <div class="form-group">
                <label for="fullName">Họ và Tên <span style="color: #d97e7e;">*</span></label>
                <input type="text" id="fullName" name="fullName" placeholder="Nhập họ và tên của bạn" required>
                <div class="error-message" id="nameError"></div>
            </div>

            <!-- Email và Số Điện Thoại -->
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email <span style="color: #d97e7e;">*</span></label>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    <div class="error-message" id="emailError"></div>
                </div>
                <div class="form-group">
                    <label for="phone">Số Điện Thoại</label>
                    <input type="tel" id="phone" name="phone" placeholder="0123456789">
                </div>
            </div>

            <!-- Địa chỉ -->
            <div class="form-group">
                <label for="address">Địa Chỉ</label>
                <input type="text" id="address" name="address" placeholder="Nhập địa chỉ của bạn">
            </div>

            <!-- Mật Khẩu và Xác Nhận Mật Khẩu -->
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Mật Khẩu <span style="color: #d97e7e;">*</span></label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">👁️</button>
                    </div>
                    <div class="error-message" id="passwordError"></div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Xác Nhận Mật Khẩu <span style="color: #d97e7e;">*</span></label>
                    <div class="password-container">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">👁️</button>
                    </div>
                    <div class="error-message" id="confirmPasswordError"></div>
                </div>
            </div>

            <!-- Điều Khoản và Điều Kiện -->
            <div class="form-group">
                <label class="terms">
                    <input type="checkbox" id="terms" name="terms" required>
                    Tôi đồng ý với <a href="#" style="color: #d97e7e; text-decoration: none;">điều khoản sử dụng</a> và <a href="#" style="color: #d97e7e; text-decoration: none;">chính sách bảo mật</a>
                </label>
                <div class="terms-error" id="termsError">Vui lòng đồng ý với các điều khoản</div>
            </div>

            <!-- Nút Đăng Ký -->
            <button type="submit" class="btn-register">Đăng Ký</button>
        </form>

        <!-- Liên Kết Đăng Nhập -->
        <div class="login-link">
            Đã có tài khoản? <a href="login.html">Đăng Nhập Tại Đây</a>
        </div>
    </div>

    <!-- Thông Báo -->
    <div id="toast" class="toast">Thành công!</div>

    <!-- JavaScript -->
    <script>
        // --- QUẢN LÝ DỮ LIỆU TỪ LOCAL STORAGE ---
        let users = JSON.parse(localStorage.getItem('venus_users')) || [];

        // --- HÀM HIỂN THỊ THÔNG BÁO ---
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('error');
            if (isError) {
                toast.classList.add('error');
            }
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // --- HÀM TỨC THỜI MẬT KHẨU ---
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
            } else {
                field.type = 'password';
            }
        }

        // --- HÀM XÓA THÔNG BÁO LỖI ---
        function clearErrors() {
            document.getElementById('nameError').style.display = 'none';
            document.getElementById('emailError').style.display = 'none';
            document.getElementById('passwordError').style.display = 'none';
            document.getElementById('confirmPasswordError').style.display = 'none';
            document.getElementById('termsError').style.display = 'none';
        }

        // --- HÀM HIỂN THỊ LỖI ---
        function showError(fieldId, message) {
            const errorEl = document.getElementById(fieldId + 'Error');
            if (errorEl) {
                errorEl.innerText = message;
                errorEl.style.display = 'block';
            }
        }

        // --- HÀM KIỂM TRA TÍNH HỢP LỆ CỦA EMAIL ---
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        // --- HÀM XỬ LÝ ĐĂNG KÝ ---
        function handleRegister(event) {
            event.preventDefault();
            clearErrors();

            // Lấy dữ liệu từ form
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const termsAccepted = document.getElementById('terms').checked;

            let isValid = true;

            // Kiểm tra tên
            if (fullName.length < 3) {
                showError('name', 'Tên phải có ít nhất 3 ký tự');
                isValid = false;
            }

            // Kiểm tra email
            if (!isValidEmail(email)) {
                showError('email', 'Email không hợp lệ');
                isValid = false;
            }

            // Kiểm tra email đã tồn tại
            const emailExists = users.some(u => u.email === email);
            if (emailExists) {
                showError('email', 'Email này đã được đăng ký');
                isValid = false;
            }

            // Kiểm tra mật khẩu
            if (password.length < 6) {
                showError('password', 'Mật khẩu phải có ít nhất 6 ký tự');
                isValid = false;
            }

            // Kiểm tra xác nhận mật khẩu
            if (password !== confirmPassword) {
                showError('confirmPassword', 'Mật khẩu không khớp');
                isValid = false;
            }

            // Kiểm tra điều khoản
            if (!termsAccepted) {
                document.getElementById('termsError').style.display = 'block';
                isValid = false;
            }

            // Nếu tất cả hợp lệ, tạo tài khoản mới
            if (isValid) {
                const newUser = {
                    id: Date.now(),
                    name: fullName,
                    email: email,
                    phone: phone,
                    address: address,
                    password: password, // ⚠️ Lưu ý: Trong thực tế, nên mã hóa mật khẩu
                    createdAt: new Date().toISOString()
                };

                users.push(newUser);
                localStorage.setItem('venus_users', JSON.stringify(users));

                showToast('✓ Đăng ký thành công! Đang chuyển hướng...');

                // Chuyển đến trang đăng nhập sau 1.5 giây
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            }
        }

        // Xóa lỗi khi người dùng bắt đầu nhập
        document.getElementById('fullName').addEventListener('input', () => {
            document.getElementById('nameError').style.display = 'none';
        });

        document.getElementById('email').addEventListener('input', () => {
            document.getElementById('emailError').style.display = 'none';
        });

        document.getElementById('password').addEventListener('input', () => {
            document.getElementById('passwordError').style.display = 'none';
        });

        document.getElementById('confirmPassword').addEventListener('input', () => {
            document.getElementById('confirmPasswordError').style.display = 'none';
        });

        document.getElementById('terms').addEventListener('change', () => {
            document.getElementById('termsError').style.display = 'none';
        });
    </script>
</body>

</html>
